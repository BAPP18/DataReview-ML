name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Static checks
        run: |
          ruff check .
          ruff format --check .

      - name: Compile Python sources
        run: python -m compileall -q app src tests validate_env.py

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Validate notebooks compile
        run: |
          python - <<'EOF'
          import glob, json
          bad = 0
          for path in sorted(glob.glob("notebooks/*.ipynb")):
              with open(path, encoding="utf-8") as handle:
                  nb = json.load(handle)
              for i, cell in enumerate(nb["cells"]):
                  if cell["cell_type"] != "code":
                      continue
                  src = "\n".join(
                      line
                      for line in "".join(cell["source"]).splitlines()
                      if not line.strip().startswith(("!", "%"))
                  )
                  try:
                      compile(src, f"{path} cell {i}", "exec")
                  except SyntaxError as exc:
                      print(f"FAIL {path} cell {i}: {exc}")
                      bad += 1
          raise SystemExit(1 if bad else 0)
          EOF

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t datareview-ml:ci .
